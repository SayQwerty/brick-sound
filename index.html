<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Студия звукозаписи на Маяковской — Brick Sound, Москва</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.png">
</head>
<body>
<header class="header"><div class="wrap header-inner"><a class="logo" href="index.html">BRICK SOUND <span>МАЯК</span></a></div></header>
<main>
<section class="hero"><div class="wrap hero-content"><h1>Студия звукозаписи у метро Маяковская</h1><p><a href="#lead">К заявке</a></p></div></section>
<section id="lead" class="wrap form-box">
  <h2>Оставить заявку</h2>
  <form id="lead-form" name="lead" method="POST" data-netlify="true" netlify-honeypot="company">
    <input type="hidden" name="form-name" value="lead">
    <input class="hp" name="company" tabindex="-1" autocomplete="off">
    <div><label for="name">Имя</label><input id="name" name="name" required></div>
    <div><label for="contact">Телефон или Telegram</label><input id="contact" name="contact" required></div>
    <div><label for="service">Услуга</label>
      <select id="service" name="service">
        <option>Записать вокал</option>
        <option>Аренда / самозапись</option>
        <option>Подкаст</option>
        <option>Песня под ключ</option>
        <option>Для бизнеса</option>
        <option>Сведение / другое</option>
      </select>
    </div>
    <div><label for="when">Дата / окно</label><input id="when" name="when"></div>
    <div><label for="comment">Комментарий</label><textarea id="comment" name="comment"></textarea></div>
    <label class="check"><input type="checkbox" name="agree" required> Согласен(а) на обработку персональных данных. <a href="privacy.html">Политика</a></label>
    <button class="btn btn-accent" type="submit">Отправить заявку</button>
  </form>
  <div class="form-ok"><h3>Заявка собрана</h3><p>Напишите в WhatsApp — так быстрее.</p><a class="btn btn-wa" data-wa-msg href="#">Открыть WhatsApp</a></div>
</section>
</main>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
